# Thelivu — Source Registry
#
# The editable control surface for what the engine ingests. Humans edit this by
# hand; the source-scout skill proposes additions as `status: candidate`; the
# orchestrator reads `status: active` entries to know what to watch.
#
# Two things to keep honest:
# 1. ROLE. A "lead" source surfaces things to look into (Tier 3 — a creator's
#    say-so). A "verification" source is what you check leads AGAINST (Tier 1-2:
#    primary records, established news). Right now EVERY source below is a lead
#    source. The engine has NO dedicated verification sources yet — that's the
#    biggest gap, and the scout's first job is to fill it. You cannot verify a
#    lead using other leads that share its politics; that's an echo chamber, not
#    verification.
# 2. INGESTION differs by platform. YouTube has RSS (clean). Instagram does not
#    and blocks scraping — it needs the Graph API or manual URL submission.

defaults:
  tier: 3
  role: lead
  status: active
  track_record: { ingested: 0, claims_verified: 0, claims_failed: 0, reliability: unrated }

