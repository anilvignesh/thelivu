<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nagaland MGNREGS</title>
<style>
  html, body { margin: 0; height: 100%; background: #0C0A06; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  NAGALAND MGNREGS — 9:16, 33s @ 120 BPM, 24fps, motion on 1s, hard cuts on the 8th grid. Every number on screen is a
//  Thelivu finding grounded in CAG's Audit Report for the year ended 31 March 2024 (Nagaland, Economic Sector, MGNREGS):
//  para 3.2.8.5 (delay in release of funds) and 3.2.8.6 (shortfall in release of State matching share).
//  Colour code: cream = the rule / neutral, gold = money released, red = what is late or missing.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = Math.round(VOICE.duration * 24) / 24;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = 'Cambria, "Cambria Math", "Latin Modern Roman", "CMU Serif", "STIX Two Text", "Times New Roman", Georgia, serif';
const CX = 500;

// ---- the voice is the clock: VL(id) is a spoken line, WD(id, [words], n, frac) is when its n-th matching word starts
// (matching ignores case and punctuation; if the recogniser wrote a numeral for a spoken number, list both; frac is the
// fallback position inside the line, 0..1)
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9.]/g, '');
const WD = (id, words, n = 1, frac = 0) => {
  const L = VL(id), want = words.map(norm); let k = 0;
  for (const x of L.words) if (want.includes(norm(x.w)) && ++k === n) return x.t0;
  return L.t0 + frac * (L.t1 - L.t0);
};
const snap = (x) => Math.round(x / E8) * E8;
const C1 = snap(VL('delay').t0 - 0.1), C2 = snap(VL('bill').t0 - 0.1), C3 = snap(VL('owed').t0 - 0.1),
      C4 = snap(VL('reply').t0 - 0.1), C5 = snap(VL('reply').t1 + 1.8);
const ERA_LIST = [[0, C1, () => sceneRule()], [C1, C2, () => sceneDelay()], [C2, C3, () => sceneBill()], [C3, C4, () => sceneShare()], [C4, C5, () => sceneReply()], [C5, DURATION, () => sceneSignoff()]];
const SHOTS = [
  ['rule',  0, 0.0, C1, 'the rule: Central money passed on within 3 days'],
  ['delay', 1, C1, C2, '₹1,710.34 crore released 4 to 238 days late'],
  ['bill',  2, C2, C3, 'late release carries interest: ₹22.37 crore'],
  ['share', 3, C3, C4, 'the State released 69% of its ₹338.09 crore share'],
  ['reply', 4, C4, C5, 'the State reply, and the source'],
  ['sign',  5, C5, DURATION, 'Thelivu sign-off, silent'],
];
const CUES = {
  rule: WD('rule', ['central']), days3: WD('rule', ['three', '3']), axis: WD('rule', ['rural']) + 0.1,
  big: WD('delay', ['one', '1', '1,710']), late: WD('delay', ['late']), bars: WD('delay', ['four', '4']),
  longest: WD('delay', ['two', '238', '2'], 1, 0.6),
  bill: WD('bill', ['twelve', '12']), why: WD('bill', ['audit']) + 0.1, count: WD('bill', ['twenty-two', '22', '22.37'], 1, 0.6),
  owed: VL('owed').t0 + 0.2, outline: WD('owed', ['owed']), fill: WD('owed', ['released']) + 0.1,
  pct1: WD('owed', ['thirty-four', '234'], 1, 0.9), red: VL('owed').t1 + 0.5, pct2: VL('short').t0 + 0.2,
  reply: VL('reply').t0 + 0.3, source: VL('reply').t0 + 3.4, rule2: VL('reply').t0 + 5.0, sign: C5 + 0.3,
};
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'chronology-cuts',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [C1, C2, C3, C4, C5],
  morphs: [],
  cues: CUES,
  acts: [
    { name: '1 The rule',  role: 'setup', t0: 0.0, t1: C1 },
    { name: '2 The delay', role: 'build', t0: C1, t1: C3 },
    { name: '3 The gap',   role: 'gift',  t0: C3, t1: DURATION },
  ],
  board: SHOTS.map(([, , t0, , title]) => ({ t: t0 + 0.5, title, sound: 'voice over a quiet pad', next: '' })),
  narration: VOICE.lines.map((l) => ({ t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
